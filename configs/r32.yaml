# LoRA rank 32. Everything except condition, rank and lr must match the other configs (decision 4).
condition: r32
rank: 32
lr: 1.0e-3            # chosen by the validation-only LR sweep (results/pilot/pilot_lora_lr_*.csv)
n_per_class: 20       # frozen validation-only N pilot, 14 Oct (decision log: paddy.md)
split: data/splits/split_v1.csv     # spatial split (41 km cells), scripts/build_split.py
batch_size: 32
weight_decay: 0.01
max_epochs: 50
patience: 5
lora_dropout: 0.1
